services:
  ticker:
    build: .
    init: true
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      reverse-network:
        aliases:
          - safetrade-ticker
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN in .env}"
      POLL_SECONDS: "${POLL_SECONDS:-60}"
      MAX_AGE_SECONDS: "${MAX_AGE_SECONDS:-180}"
      BROWSER_TIMEOUT_SECONDS: "${BROWSER_TIMEOUT_SECONDS:-60}"
      HEADLESS: "${HEADLESS:-false}"
    volumes:
      - browser-data:/data
    shm_size: 1gb
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  browser-data:

networks:
  reverse-network:
    external: true
